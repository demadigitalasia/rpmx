services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpmx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset di .env}
      POSTGRES_DB: ${POSTGRES_DB:-rpmx}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpmx} -d ${POSTGRES_DB:-rpmx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rpmx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rpmx}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD wajib diset di .env}
    ports:
      # Audit P1-6: bind ke localhost host saja — aplikasi tak lagi reachable
      # plaintext (tanpa TLS) langsung dari internet.
      # ROLLBACK bila domain 404 pasca redeploy: kembalikan ke "3000:3000".
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Cek app (bukan DB): DB down jangan restart app — app dirancang hidup
      # dengan fallback konten. Detail status DB ada di GET /api/health.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/robots.txt >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db-backup:
    # Sidecar backup harian (audit P1-4): pg_dump custom-format ke volume,
    # rotasi 14 hari. Restore: pg_restore -h db -U $POSTGRES_USER -d rpmx <file>
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-rpmx}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset di .env}
      PGDATABASE: ${POSTGRES_DB:-rpmx}
    volumes:
      - db_backups:/backups
    command: >
      sh -c 'while true; do
        pg_dump -Fc -f /backups/rpmx-$$(date +%Y%m%d-%H%M%S).dump && echo "[backup] ok";
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  db_data:
  db_backups:
